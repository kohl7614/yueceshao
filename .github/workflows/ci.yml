name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "尚无 requirements.txt，跳过项目依赖安装"
          fi
          pip install pytest
      - name: 跑测试（如存在）
        run: |
          if find . -name "test_*.py" -not -path "./.git/*" | grep -q .; then
            python -m pytest -q
          else
            echo "尚无测试文件，CI 通过（首个功能 PR 必须带入测试）"
          fi

  # 静态检查（建议模式）：按 .ruff.toml 在日志里报告存量问题；结论恒绿，
  # 避免长期红叉让人对红灯脱敏。存量清零后：删掉 `|| true` 与 --statistics，转强制门。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff 检查（编码规范静态化，建议模式）
        run: ruff check . --statistics || true
